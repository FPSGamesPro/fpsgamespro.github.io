<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ricochet Renegade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@600;800&display=swap" rel="stylesheet">
    <style>
      :root{--ink:#101a2d;--cream:#fff0c7;--orange:#ff8b32;--red:#ef3c38;--teal:#19b4ad}
      *{box-sizing:border-box} html,body,#game-container{width:100%;height:100%;margin:0;overflow:hidden;background:#0d1424}
      body{font-family:Inter,system-ui,sans-serif;touch-action:none}
      #game-container{position:relative;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#384d67,#121a2b 72%)}
      #frame{position:relative;width:min(100vw,177.78vh);height:min(56.25vw,100vh);overflow:hidden;background:#edc278;box-shadow:0 20px 80px #0009}
      #game{display:block;width:100%;height:100%;cursor:crosshair}
      #hud{position:absolute;inset:0;pointer-events:none;color:var(--cream);font-family:"Barlow Condensed",sans-serif;text-transform:uppercase}
      .brand{position:absolute;left:2.1%;top:2%;display:flex;align-items:center;gap:12px;filter:drop-shadow(0 4px 0 #11182b)}
      .brand img{width:72px;height:72px;object-fit:contain}.brand strong{font-size:34px;line-height:.84;letter-spacing:1px}.brand em{display:block;color:#ffaf41;font-style:normal}
      .level{position:absolute;top:2.8%;left:50%;transform:translateX(-50%);padding:8px 25px;border:3px solid #ffeabb;border-radius:20px;background:#101a2de8;font-size:27px;letter-spacing:2px;box-shadow:0 6px 0 #080e1d}
      .shots{position:absolute;right:2.2%;top:2.5%;padding:9px 16px 8px;border:3px solid #ffeabb;border-radius:18px;background:#101a2de8;text-align:right;box-shadow:0 6px 0 #080e1d}.shots b{font-size:18px;letter-spacing:2px}.rounds{display:flex;gap:7px;margin-top:3px}.round{width:13px;height:34px;border-radius:8px 8px 4px 4px;background:linear-gradient(90deg,#b95420,#ffd65a 50%,#df7b26);border:2px solid #3a2119;transition:.2s}.round.spent{opacity:.18;transform:translateY(8px)}
      #hint{position:absolute;bottom:2.8%;left:50%;transform:translateX(-50%);padding:9px 22px;border-radius:22px;background:#101a2dcc;font:800 18px Inter;color:#fff1ca;letter-spacing:.4px;transition:.25s}
      #mute{position:absolute;left:2.4%;bottom:3%;pointer-events:auto;border:3px solid #ffe5a3;border-radius:50%;width:48px;height:48px;background:#131d31;color:white;font-size:21px;cursor:pointer;box-shadow:0 5px 0 #080e1d}
      #overlay{position:absolute;inset:0;display:none;place-items:center;background:#10182bd9;backdrop-filter:blur(4px);pointer-events:auto;color:white;text-align:center}
      #overlay.show{display:grid}.card{min-width:430px;padding:36px 55px 42px;border:5px solid #ffe7a9;border-radius:30px;background:linear-gradient(145deg,#1f3552,#111a2d);box-shadow:0 14px 0 #070d19,0 30px 70px #0008;transform:rotate(-1deg)}
      #resultIcon{font-size:65px;line-height:1}#resultTitle{font:900 64px/1 "Barlow Condensed";text-transform:uppercase;margin:10px 0 3px;color:#ffb13c;text-shadow:0 5px 0 #8b301e}#resultSub{font:700 20px/1.3 Inter;color:#e4edf3;margin:0 0 25px}
      #retry{border:0;border-radius:16px;padding:14px 40px;background:linear-gradient(#ffbe43,#f36d2e);color:#25160e;font:900 27px "Barlow Condensed";text-transform:uppercase;box-shadow:0 7px 0 #8a2c1d;cursor:pointer}#retry:active{transform:translateY(5px);box-shadow:0 2px 0 #8a2c1d}
      @media(max-width:700px){.brand strong{display:none}.brand img{width:50px;height:50px}.level{font-size:18px}.shots{transform:scale(.8);transform-origin:top right}.card{min-width:320px;padding:25px}#resultTitle{font-size:48px}}
    </style>
  </head>
  <body>
    <div id="game-container"><div id="frame">
      <svg id="game" viewBox="0 0 1920 1080" role="img" aria-label="Ricochet puzzle shooter">
        <defs>
          <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#50afbd"/><stop offset=".56" stop-color="#f2c276"/><stop offset="1" stop-color="#e88b52"/></linearGradient>
          <linearGradient id="sand" x2="0" y2="1"><stop stop-color="#d98548"/><stop offset="1" stop-color="#a34637"/></linearGradient>
          <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="5" flood-opacity=".35"/></filter>
          <filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <pattern id="grain" width="90" height="40" patternUnits="userSpaceOnUse"><path d="M4 30q20-12 42 0t40 0" fill="none" stroke="#7a3831" stroke-opacity=".18" stroke-width="5"/></pattern>
        </defs>
        <g id="world"></g><g id="dynamic"></g><g id="fx"></g><g id="aim"></g>
      </svg>
      <div id="hud">
        <div class="brand"><img src="assets/ricochet-badge.webp" alt=""><strong>Ricochet<em>Renegade</em></strong></div>
        <div class="level" id="levelLabel">Wanted 01</div>
        <div class="shots"><b>Rounds</b><div class="rounds"><i class="round"></i><i class="round"></i><i class="round"></i></div></div>
        <div id="hint">Move your mouse to aim • Click to fire</div><button id="mute" aria-label="Toggle sound">♫</button>
        <div id="overlay"><div class="card"><div id="resultIcon">★</div><h1 id="resultTitle">Clean Shot!</h1><p id="resultSub">All bandits cleared.</p><button id="retry">Next Level</button></div></div>
      </div>
    </div></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
